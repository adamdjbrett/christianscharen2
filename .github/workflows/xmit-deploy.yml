name: Deploy to Xmit

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: xmit-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      XMIT_SITE: chris2.xmit.dev
      XMIT_TEAM: 626
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Verify build output
        run: test -f _site/index.html && test -f _site/404.html && grep -q "https://$XMIT_SITE/" _site/index.html
      - name: Deploy to Xmit team 626
        run: npx --yes @xmit.co/xmit@0.5.2-0 "$XMIT_SITE@$XMIT_TEAM" _site
        env:
          XMIT_KEY: ${{ secrets.XMIT_KEY }}
