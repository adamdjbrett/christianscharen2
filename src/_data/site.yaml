# Site-wide settings, read by every page as site.*

title: "Christian Scharen"  # site name: tabs, feeds, nav
description: "Writing, books, and public work by practical theologian Christian Scharen."  # default meta description
url: "https://christianscharen.com"  # live address with https://, no trailing slash
language: "en"  # page language

land_acknowledgement: |  # footer text, markdown
  I acknowledge with respect the Bodwéwadmi (Potawatomi) people on whose unceded and ancestral lands I reside in what is now called Chicago. To find the Indigenous origins of the land where you live, visit the [Native Land project](https://native-land.ca/).

# About Christian
