  time: 7:00 PM - 9:00 PM
  image: /assets/images/bookcover.webp
  thumbnail: /assets/images/bookcover_tn.webp
  venue: First Lutheran Church
  city: Minneapolis, MN
  body: |
    Join us for the official book launch of *Custer Died for Our Sins*. Christian will be in conversation with local theologians and community leaders about settler repair and the theology of truth-telling.

